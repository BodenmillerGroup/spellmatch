name: test-and-deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Run pre-commit
        run: uv run --only-group lint pre-commit run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.extras }} ${{ matrix.sync }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]
        extras: ["--extra gui"]
        include:
          # without optional dependencies
          - platform: ubuntu-latest
            python-version: "3.14"
            extras: ""
          # lowest versions of direct dependencies (checks the lower bounds, which
          # are the first versions with wheels for Python 3.14)
          - platform: ubuntu-latest
            python-version: "3.14"
            extras: ""
            sync: "--resolution lowest-direct"
          # all optional dependencies and the benchmark dependency group
          - platform: ubuntu-latest
            python-version: "3.14"
            extras: "--extra all --group benchmark"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Qt libraries
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1
      - name: Install dependencies
        run: uv sync ${{ matrix.sync || '--locked' }} --no-default-groups --group test ${{ matrix.extras }}
      - name: Run tests
        run: uv run --no-sync pytest
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
      - name: Build package
        run: uv build
      - name: Check package
        run: uvx twine check --strict dist/*
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  deploy:
    needs: [build]
    # deploy from the upstream repository only (not from forks)
    if: github.repository == 'BodenmillerGroup/spellmatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spellmatch/
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "spellmatch"
dynamic = ["version"]
description = "Spatial cell representation matching"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Windhager", email = "jonas@windhager.io" }]
requires-python = ">=3.13"
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "click>=8.2",
    "click-log>=0.4",
    "numpy>=2.2",
    "opencv-python-headless>=4.11",
    "pandas>=2.3",
    "pluggy>=1.6",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "scikit-image>=0.25",
    "scikit-learn>=1.6",
    "scipy>=1.15",
    "shapely>=2.1",
    "simpleitk>=2.5",
    "tifffile>=2024.12.12",
    "xarray>=2024.10",
]

[project.optional-dependencies]
gui = ["napari[all]>=0.6", "pyqtgraph>=0.14", "qtpy>=2.4"]
# probreg 0.3.8 hard-codes 3D point clouds, breaking 2D registration
probreg = ["probreg>=0.3.5,<0.3.8"]
cuda = ["cupy-cuda12x"]
nonfree = ["opencv-contrib-python-headless>=4.11"]
all = ["spellmatch[gui,probreg]"]

[project.scripts]
spellmatch = "spellmatch.__main__:cli"

[project.urls]
Homepage = "https://github.com/BodenmillerGroup/spellmatch"
Documentation = "https://bodenmillergroup.github.io/spellmatch"
Issues = "https://github.com/BodenmillerGroup/spellmatch/issues"
Changelog = "https://github.com/BodenmillerGroup/spellmatch/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=6"]
lint = ["pre-commit>=4", "ruff>=0.13"]
docs = ["mike>=2.1", "mkdocs-material>=9.6", "mkdocstrings[python]>=0.30"]
# simutome is not available on PyPI (and direct URL dependencies are not allowed in
# published extras), so the benchmark dependencies are provided as a dependency group
benchmark = ["simutome"]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
simutome = { git = "https://github.com/BodenmillerGroup/simutome" }

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "spellmatch/_version.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/data",
    "/docs",
    "/publication",
    "/environment.yml",
    "/mkdocs.yml",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["spellmatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov=spellmatch", "--cov-report=xml"]
pythonpath = ["tests"]
